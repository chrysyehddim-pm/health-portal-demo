<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的動腦紀錄｜GO HEALTH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="assets/shared.css" rel="stylesheet">
</head>
<body data-page="records">
<div class="mobile-container" id="app-root">
  <header class="bg-white/96 backdrop-blur px-4 py-3 border-b border-slate-100 sticky top-0 z-50 flex items-center justify-center">
    <button aria-label="GO HEALTH Logo" class="inline-flex items-center justify-center active:opacity-80 transition" type="button" onclick="navigateTo('index.html')">
      <img alt="GO HEALTH" class="h-8 w-auto object-contain" onerror="this.outerHTML='&lt;h1 class=&quot;text-lg font-black text-green-700 tracking-wider&quot;&gt;GO HEALTH&lt;/h1&gt;'" src="images/logo.png">
    </button>
  </header>

  <main class="records-main">
    <section aria-labelledby="records-title">
      <div class="records-heading-icon" aria-hidden="true"><i class="fa-solid fa-chart-line"></i></div>
      <div>
        <h1 class="records-title" id="records-title">我的動腦紀錄</h1>
        <p class="records-subtitle">看看最近的遊戲互動與完成紀錄</p>
      </div>
    </section>

    <section class="records-overview" aria-label="本月動腦紀錄總覽">
      <article class="overview-card overview-card-green">
        <div class="overview-icon"><i class="fa-regular fa-calendar-check"></i></div>
        <p>本月互動天數</p>
        <strong id="summary-days">—</strong><span>天</span>
      </article>
      <article class="overview-card overview-card-blue">
        <div class="overview-icon"><i class="fa-solid fa-gamepad"></i></div>
        <p>本月完成遊戲次數</p>
        <strong id="summary-games">—</strong><span>次</span>
      </article>
      <article class="overview-card overview-card-amber">
        <div class="overview-icon"><i class="fa-regular fa-clock"></i></div>
        <p>最近一次互動日期</p>
        <strong class="overview-date" id="summary-date">—</strong>
      </article>
      <article class="overview-card overview-card-purple">
        <div class="overview-icon"><i class="fa-solid fa-star"></i></div>
        <p>本月最常玩的遊戲</p>
        <strong class="overview-game" id="summary-favorite">—</strong>
      </article>
    </section>

    <section aria-labelledby="game-filter-title">
      <h2 class="sr-only" id="game-filter-title">選擇遊戲</h2>
      <div class="game-tabs" id="game-tabs" role="tablist" aria-label="選擇遊戲"></div>
    </section>

    <section class="game-record-panel" id="game-record-panel" aria-labelledby="selected-game-name">
      <div class="record-chart-card">
        <div class="record-card-heading">
          <div class="chart-title-row">
            <div class="selected-game-icon" id="selected-game-icon" aria-hidden="true"></div>
            <div>
              <p class="selected-game-kicker">最近 10 次完成時間</p>
              <h2 id="selected-game-name">—</h2>
            </div>
          </div>
          <div class="chart-scroll-hint">較早 → 最近</div>
        </div>
        <div class="record-chart-scroll" aria-label="最近 10 次完成時間折線圖">
          <svg id="record-chart" role="img" aria-labelledby="chart-title chart-description" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet">
            <title id="chart-title">近期完成時間折線圖</title>
            <desc id="chart-description">顯示最近三個月內最多十筆完成秒數，每個資料點皆標示挑戰 Level，右側為最近一次。</desc>
          </svg>
        </div>
        <p class="record-comparison-note"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> 最近三個月最多 10 筆；不同 Level 的完成秒數不直接比較。</p>
      </div>

      <div class="game-stats">
        <article class="game-stat">
          <p>最近一次完成秒數</p>
          <div><strong id="latest-seconds">—</strong><span>秒</span></div>
          <small id="latest-level">—</small>
        </article>
        <article class="game-stat">
          <p>同 Level 個人最佳</p>
          <div><strong id="best-seconds">—</strong><span>秒</span></div>
          <small id="best-level">—</small>
        </article>
        <article class="game-stat">
          <p>累積挑戰次數</p>
          <div><strong id="challenge-count">—</strong><span>次</span></div>
          <small>包含不同挑戰強度</small>
        </article>
      </div>

      <div class="record-list-card">
        <div class="record-card-heading">
          <div>
            <h3>最近互動紀錄</h3>
            <p>顯示最近三個月內最多 10 筆完成紀錄，最新紀錄列於最上方</p>
          </div>
        </div>
        <div class="record-list-header" aria-hidden="true">
          <span>完成時間</span><span>Level</span><span>完成秒數</span>
        </div>
        <div class="record-list" id="record-list"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主要導覽">
    <button class="nav-btn" onclick="navigateTo('index.html')">
      <i class="fas fa-house"></i><span>首頁</span>
    </button>
    <button class="nav-btn" onclick="navigateTo('group.html')">
      <i class="fas fa-users"></i><span>群組</span>
    </button>
    <button class="nav-btn active" aria-current="page" onclick="navigateTo('records.html')">
      <i class="fas fa-chart-line"></i><span>紀錄</span>
    </button>
  </nav>
</div>
<script src="assets/data.js"></script>
<script src="assets/shared.js"></script>
<script src="assets/records.js"></script>
</body>
</html>
